name: Complete CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify Maven dependencies
        run: mvn dependency:go-offline

      - name: Compile project
        run: mvn clean compile

      - name: Run unit tests
        run: mvn test

      - name: SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/battleship-game:latest .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/battleship-game:latest

      - name: Generate Maven site and Javadocs
        run: mvn -Dmaven.test.skip=true -Ddoclint=none -Dmaven.javadoc.failOnError=false site javadoc:javadoc

      - name: Update documentation folder
        run: |
          rm -rf docs/site docs/apidocs
          mkdir -p docs/site docs/apidocs
          cp -r target/site/* docs/site/
          cp -r target/reports/apidocs/* docs/apidocs/

      - name: Ensure documentation index exists
        run: |
          cat > docs/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Discoveries Battleship Game</title>
            <style>
              body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; color: #1f2937; }
              header { background: #0f172a; color: white; padding: 48px 24px; text-align: center; }
              header h1 { margin: 0; font-size: 2.4rem; }
              header p { margin-top: 12px; color: #cbd5e1; font-size: 1.1rem; }
              main { max-width: 960px; margin: 32px auto; padding: 0 24px; }
              section { background: white; padding: 24px; margin-bottom: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08); }
              h2 { color: #0f172a; margin-top: 0; }
              pre { background: #0f172a; color: #e5e7eb; padding: 16px; border-radius: 8px; overflow-x: auto; }
              .links { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
              .button { display: inline-block; padding: 12px 18px; background: #2563eb; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
              .button:hover { background: #1d4ed8; }
              footer { text-align: center; padding: 24px; color: #64748b; }
            </style>
          </head>
          <body>
            <header>
              <h1>Discoveries Battleship Game</h1>
              <p>Java/Maven Battleship project with automatic documentation and a complete CI/CD pipeline.</p>
            </header>

            <main>
              <section>
                <h2>About the project</h2>
                <p>This project implements a Battleship game in Java, using Maven, Docker, GitHub Actions and SonarQube Cloud.</p>
              </section>

              <section>
                <h2>Documentation</h2>
                <p>The technical documentation is available through the Maven site and the generated Javadocs.</p>
                <div class="links">
                  <a class="button" href="site/">Maven Site</a>
                  <a class="button" href="apidocs/">Javadocs</a>
                </div>
              </section>

              <section>
                <h2>Docker execution</h2>
                <pre><code>docker pull USERNAME_DOCKERHUB/battleship-game:latest
          docker run -it --rm USERNAME_DOCKERHUB/battleship-game:latest</code></pre>
              </section>
            </main>

            <footer>Software Engineering - Complete CI/CD Pipeline</footer>
          </body>
          </html>
          EOF

      - name: Commit updated documentation
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update GitHub Pages documentation [skip ci]"
          git push